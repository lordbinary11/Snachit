<div class="period-banner"><div class="banner-icon">▦</div><div><strong>November 2026 validation period</strong><p>Monthly staff confirmation · Period closes 31 November 2026</p></div><div class="banner-right">TIME REMAINING<strong>20 days</strong></div></div>
<div class="stats"><div class="stat goldstat"><div class="stat-top">Staff in scope <span class="stat-icon">♙</span></div><strong>${total}</strong><div class="trend">${role==='admin'?'Across 4 faculties':'Assigned to your department'}</div></div><div class="stat greenstat"><div class="stat-top">Validated <span class="stat-icon">✓</span></div><strong>${valid}</strong><div class="trend"><b>${Math.round(valid/total*100)||0}%</b> of staff in scope</div></div><div class="stat amberstat"><div class="stat-top">Awaiting review <span class="stat-icon">◷</span></div><strong>${pending}</strong><div class="trend">${role==='admin'?'Require validator action':'Ready for your review'}</div></div><div class="stat redstat"><div class="stat-top">Exceptions <span class="stat-icon">!</span></div><strong>${exception}</strong><div class="trend">${exception?'Require admin follow-up':'No unresolved exceptions'}</div></div></div>
<div class="content-grid"><section class="panel"><div class="panel-head"><div><h2>${role==='admin'?'Staff validation status':'Staff awaiting your validation'}</h2><p>${role==='admin'?'Live overview from the November validation roster':'Computer Science · 4 staff members assigned'}</p></div><button class="btn small" onclick="setFilter('All')">View all &nbsp;→</button></div><div class="search-row"><div class="search"><span>⌕</span><input id="searchBox" placeholder="Search by name, staff ID or department" value="${esc(searchText)}" oninput="searchText=this.value;renderTable()"></div><select class="filter" id="filterSelect" onchange="setFilter(this.value)"><option>All</option><option>Pending</option><option>Validated</option><option>Exception</option></select></div><div class="table-wrap"><table><thead><tr><th>Staff member</th><th>Department</th>${role==='admin'?'<th>Validator</th>':''}<th>Status</th><th>Last updated</th><th></th></tr></thead><tbody id="staffRows"></tbody></table></div><div class="panel-foot"><span id="rowCount">Showing</span><div class="pager"><button>‹</button><button class="current">1</button><button>2</button><button>›</button></div></div></section>
<aside class="right-col"><div class="panel progress-panel"><h2>Monthly progress</h2><p>University-wide completion</p><div class="progress-num"><strong>${Math.round(valid/total*100)||0}%</strong><span>complete</span></div><div class="progress-track"><span style="width:${Math.round(valid/total*100)||0}%"></span></div><div class="progress-legend"><div class="legend"><span><i></i>Validated</span><b>${valid}</b></div><div class="legend"><span><i></i>Pending review</span><b>${pending}</b></div><div class="legend"><span><i></i>Exception</span><b>${exception}</b></div><div class="legend"><span><i></i>Not started</span><b>${Math.max(0,total-valid-pending-exception)}</b></div></div></div>
${role==='admin'?`<div class="panel mini-panel"><h2>Department completion</h2>${deptStats.map(([n,p])=>`<div class="dept-row"><span>${n}</span><strong>${p}%</strong></div><div class="dept-track"><span style="width:${p}%"></span></div>`).join('')}</div>`:`<div class="panel mini-panel"><h2>Validation activity</h2>${eventLog.slice(0,2).map(([n,a,t])=>`<div class="activity"><i class="activity-dot"></i><p><strong>${esc(n)}</strong> ${esc(a)}<small>${esc(t)}</small></p></div>`).join('')}<div class="admin-note">Please review every assigned staff member before the period closes on 30 November.</div></div>`}
<div class="panel mini-panel"><h2>Recent activity</h2>${eventLog.slice(0,3).map(([n,a,t])=>`<div class="activity"><i class="activity-dot"></i><p><strong>${esc(n)}</strong> ${esc(a)}<small>${esc(t)}</small></p></div>`).join('')}</div></aside></div>`;
$('#filterSelect').value=filterStatus;renderTable();document.querySelectorAll('.nav').forEach(n=>{n.classList.toggle('active',n.dataset.page===currentPage)});
}
function renderTable(){const list=visibleStaff();const rows=list.map(s=>`<tr><td><div class="person"><div class="pavatar">${esc(s.initials)}</div><div><strong>${esc(s.name)}</strong><small>${esc(s.id)} · ${esc(s.title)}</small></div></div></td><td><span class="dept">${esc(s.dept)}</span></td>${role==='admin'?`<td>${esc(s.validator)}</td>`:''}<td><span class="badge ${s.status.toLowerCase()}">${esc(s.status)}</span></td><td>${esc(s.updated)}</td><td>${role==='validator'&&s.status!=='Validated'?`<button class="btn small" onclick="openValidate('${s.id}')">Review</button>`:`<button class="row-action" title="Details" onclick="showDetails('${s.id}')">···</button>`}</td></tr>`).join('');$('#staffRows').innerHTML=rows||'<tr><td colspan="6" class="empty">No staff match your search.</td></tr>';$('#rowCount').textContent=`Showing ${list.length} of ${role==='admin'?staff.length:4} staff members`}
function setFilter(v){filterStatus=v;render()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(title,body,footer){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFooter').innerHTML=footer;$('#modalBackdrop').classList.add('open')}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
function openValidate(id){const s=staff.find(x=>x.id===id);openModal('Validate staff member',`<div class="person" style="margin-bottom:18px"><div class="pavatar">${esc(s.initials)}</div><div><strong>${esc(s.name)}</strong><small>${esc(s.id)} · ${esc(s.dept)}</small></div></div><div class="field"><label>Validation decision</label><select id="decision"><option value="Validated">Confirm staff member</option><option value="Exception">Flag for follow-up</option></select></div><div class="field"><label>Comment <span style="color:#999;font-weight:400">(required for exceptions)</span></label><textarea id="decisionNote" placeholder="Add a note for the record…"></textarea></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDecision('${id}')">Save decision</button>`)}
function saveDecision(id){const s=staff.find(x=>x.id===id),d=$('#decision').value,n=$('#decisionNote').value.trim();if(d==='Exception'&&!n){toast('Add a reason before flagging an exception');return}s.status=d;s.updated='Oct 30, just now';s.reason=d==='Exception'?n:'';eventLog.unshift(['Prof. Kofi Agyeman',`${d.toLowerCase()} ${s.name}`,'Just now']);closeModal();render();toast('Validation saved to the demo record')}
function showDetails(id){const s=staff.find(x=>x.id===id);openModal('Staff record',`<div class="person" style="margin-bottom:18px"><div class="pavatar">${esc(s.initials)}</div><div><strong>${esc(s.name)}</strong><small>${esc(s.id)} · ${esc(s.title)}</small></div></div><div class="field"><label>Department</label><div>${esc(s.dept)}</div></div><div class="field"><label>Assigned validator</label><div>${esc(s.validator)}</div></div><div class="field"><label>Current status</label><span class="badge ${s.status.toLowerCase()}">${esc(s.status)}</span></div>${s.reason?`<div class="field"><label>Exception note</label><div>${esc(s.reason)}</div></div>`:''}<div class="field"><label>Last updated</label><div>${esc(s.updated)}</div></div>`,`<button class="btn" onclick="closeModal()">Close</button>${role==='admin'?`<button class="btn" onclick="openAssign('${id}')">Change validator</button>`:''}`)}
function openAssign(id=''){const s=id?staff.find(x=>x.id===id):null;openModal(s?'Change validator':'Assign department validator',`<div class="field"><label>Department</label><select id="assignDept"><option>${s?esc(s.dept):'Finance Office'}</option><option>Computer Science</option><option>Electrical Engineering</option><option>Biochemistry</option><option>Civil Engineering</option><option>Public Health</option><option>Academic Affairs</option><option>Mathematics</option><option>Human Resources</option><option>Information Technology</option></select></div><div class="field"><label>Validator</label><select id="assignValidator"><option>Prof. Kofi Agyeman</option><option>Dr. Janet Adjei</option><option>Dr. Richard Aidoo</option><option>Prof. Esi Frimpong</option><option>Prof. Michael Osei</option><option>Dr. Cynthia Boateng</option><option>Ama K. Mensah</option></select></div><div class="field"><label>Effective from</label><input type="date" value="2026-11-01"></div><div class="field"><label>Reason for assignment</label><textarea id="assignReason" placeholder="e.g. HOD appointment or temporary delegation"></textarea></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAssignment('${id}')">Save assignment</button>`)}
function saveAssignment(id){const dept=$('#assignDept').value,v=$('#assignValidator').value;staff.filter(s=>s.dept===dept).forEach(s=>s.validator=v);eventLog.unshift(['Ama K. Mensah',`assigned ${v} to ${dept}`,'Just now']);closeModal();render();toast('Validator assignment updated')}
function submitPending(){let pendingRows=staff.filter(s=>['Computer Science','Mathematics','Finance Office','Information Technology'].includes(s.dept)&&s.status==='Pending');if(!pendingRows.length){toast('No pending validations to submit');return}openModal('Submit validations',`<p style="color:#666;font-size:12px;line-height:1.6">You have <strong>${pendingRows.length} staff members</strong> still awaiting review. Submit only after each staff record has been reviewed. Pending records will remain visible after submission.</p>`,`<button class="btn" onclick="closeModal()">Go back</button><button class="btn primary" onclick="closeModal();toast('Pending validations remain in your review queue')">Continue reviewing</button>`)}
function exportCSV(){const rows=[['Staff ID','Name','Title','Department','Validator','Status','Last updated'],...staff.map(s=>[s.id,s.name,s.title,s.dept,s.validator,s.status,s.updated])];const csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='knust-validation-october-2026.csv';a.click();URL.revokeObjectURL(a.href);toast('Validation report exported')}
document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{currentPage=n.dataset.page;render();if(currentPage!=='Overview'&&currentPage!=='Staff validation')toast(`${currentPage} preview selected`)}));$('#roleSelect').addEventListener('change',e=>{role=e.target.value;filterStatus='All';searchText='';currentPage='Overview';render();toast(role==='admin'?'Admin view enabled':'HOD validator view enabled')});render();
</script>
</body>
</html>
